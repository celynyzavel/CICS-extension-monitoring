{% extends "base_coordinator.html" %}

{% block title %}Edit Technology Transfer{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-9">

        <div class="card shadow-sm">

            <div class="card-header">
                <h4 class="mb-0">Edit Technology Transfer Record</h4>
            </div>

            <div class="card-body">

                {% include "partials/_flash_messages.html" %}

                <form method="POST">

                    <!-- Capstone Title and Specialized Track -->
                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label class="form-label">
                                Capstone Title
                            </label>

                            <input
                                type="text"
                                name="capstone_title"
                                class="form-control"
                                value="{{ technology.capstone_title }}"
                                required
                            >
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">
                                Specialized Track
                            </label>

                            <select
                                name="specialized_track"
                                id="specialized_track"
                                class="form-select"
                                required
                            >
                                <option value="">Select Track</option>
                                <option value="Business Analytics" {% if technology.specialized_track == "Business Analytics" %}selected{% endif %}>
                                    Business Analytics
                                </option>
                                <option value="Network Technology" {% if technology.specialized_track == "Network Technology" %}selected{% endif %}>
                                    Network Technology
                                </option>
                                <option value="Service Management" {% if technology.specialized_track == "Service Management" %}selected{% endif %}>
                                    Service Management
                                </option>
                            </select>
                        </div>

                    </div>


                    <!-- System Type and Deployment Date -->
                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                System Type
                            </label>

                            <select
                                name="system_type"
                                id="system_type"
                                class="form-select"
                                required
                            >

                                <option value="">
                                    Select Type
                                </option>

                                <option
                                    value="Web System"
                                    {% if technology.system_type == "Web System" %}
                                        selected
                                    {% endif %}
                                >
                                    Web System
                                </option>

                                <option
                                    value="Web Application"
                                    {% if technology.system_type == "Web Application" %}
                                        selected
                                    {% endif %}
                                >
                                    Web Application
                                </option>

                                <option
                                    value="Desktop Application"
                                    {% if technology.system_type == "Desktop Application" %}
                                        selected
                                    {% endif %}
                                >
                                    Desktop Application
                                </option>

                                <option
                                    value="Mobile Application"
                                    {% if technology.system_type == "Mobile Application" %}
                                        selected
                                    {% endif %}
                                >
                                    Mobile Application
                                </option>

                                <option
                                    value="Other"
                                    {% if technology.system_type not in [
                                        "Web System",
                                        "Web Application",
                                        "Desktop Application",
                                        "Mobile Application"
                                    ] %}
                                        selected
                                    {% endif %}
                                >
                                    Other
                                </option>

                            </select>

                        </div>


                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Deployment Date
                            </label>

                            <input
                                type="date"
                                name="deployment_date"
                                class="form-control"
                                value="{{ technology.deployment_date.strftime('%Y-%m-%d') }}"
                                required
                            >

                        </div>

                    </div>


                    <!-- Other System Type -->
                    <div
                        class="row"
                        id="otherSystemTypeDiv"

                        {% if technology.system_type not in [
                            "Web System",
                            "Web Application",
                            "Desktop Application",
                            "Mobile Application"
                        ] %}
                            style="display: flex;"
                        {% else %}
                            style="display: none;"
                        {% endif %}
                    >

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Please Specify System Type
                            </label>

                            <input
                                type="text"
                                name="other_system_type"
                                id="other_system_type"
                                class="form-control"
                                placeholder="Please specify the system type"

                                value="{% if technology.system_type not in [
                                    'Web System',
                                    'Web Application',
                                    'Desktop Application',
                                    'Mobile Application'
                                ] %}{{ technology.system_type }}{% endif %}"

                                {% if technology.system_type not in [
                                    "Web System",
                                    "Web Application",
                                    "Desktop Application",
                                    "Mobile Application"
                                ] %}
                                    required
                                {% endif %}
                            >

                        </div>

                    </div>


                    <!-- Deployment Status and Partner Institution -->
                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Deployment Status
                            </label>

                            <select
                                name="deployment_status"
                                class="form-select"
                                required
                            >

                                <option value="">
                                    Select Status
                                </option>

                                <option
                                    value="Active"
                                    {% if technology.deployment_status == "Active" %}
                                        selected
                                    {% endif %}
                                >
                                    Active
                                </option>

                                <option
                                    value="Inactive"
                                    {% if technology.deployment_status == "Inactive" %}
                                        selected
                                    {% endif %}
                                >
                                    Inactive
                                </option>

                            </select>

                        </div>


                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Partner Institution
                            </label>

                            <input
                                type="text"
                                name="partner_institution"
                                class="form-control"
                                value="{{ technology.partner_institution }}"
                                required
                            >

                        </div>

                    </div>


                    <hr>

                    <h5 class="mb-3">
                        Beneficiary Information
                    </h5>


                    <!-- Beneficiary Name and Position -->
                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Beneficiary Name
                            </label>

                            <input
                                type="text"
                                name="beneficiary_name"
                                class="form-control"
                                value="{{ technology.beneficiary_name or '' }}"
                                required
                            >

                        </div>


                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Beneficiary Position
                            </label>

                            <input
                                type="text"
                                name="beneficiary_position"
                                class="form-control"
                                value="{{ technology.beneficiary_position or '' }}"
                                required
                            >

                        </div>

                    </div>


                    <!-- Beneficiary Phone Number -->
                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Beneficiary Phone Number
                            </label>

                            <input
                                type="tel"
                                name="beneficiary_phone_number"
                                class="form-control"
                                placeholder="e.g. 09123456789"
                                value="{{ technology.beneficiary_phone_number or '' }}"
                                required
                            >

                        </div>

                    </div>


                    <hr>

                    <h5 class="mb-3">
                        Users Trained
                    </h5>


                    <!-- Female, Male and Total -->
                    <div class="row">

                        <div class="col-md-4 mb-3">

                            <label class="form-label">
                                Number of Female Users Trained
                            </label>

                            <input
                                type="number"
                                name="female_users_trained"
                                id="female_users_trained"
                                class="form-control"
                                min="0"
                                value="{{ technology.female_users_trained or 0 }}"
                                required
                            >

                        </div>


                        <div class="col-md-4 mb-3">

                            <label class="form-label">
                                Number of Male Users Trained
                            </label>

                            <input
                                type="number"
                                name="male_users_trained"
                                id="male_users_trained"
                                class="form-control"
                                min="0"
                                value="{{ technology.male_users_trained or 0 }}"
                                required
                            >

                        </div>


                        <div class="col-md-4 mb-3">

                            <label class="form-label">
                                Total Users Trained
                            </label>

                            <input
                                type="number"
                                id="total_users_trained"
                                class="form-control"
                                value="{{ technology.total_users_trained or 0 }}"
                                readonly
                            >

                        </div>

                    </div>


                    <!-- Buttons -->
                    <div class="d-flex gap-2 mt-3">

                        <a
                            href="{{ url_for('main.TechnologyTransfer') }}"
                            class="btn btn-secondary"
                        >
                            Cancel
                        </a>

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Save Changes
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>
</div>


<script>
document.addEventListener('DOMContentLoaded', function () {

    // Other System Type
    const systemType =
        document.getElementById('system_type');

    const otherDiv =
        document.getElementById('otherSystemTypeDiv');

    const otherInput =
        document.getElementById('other_system_type');


    systemType.addEventListener('change', function () {

        if (this.value === 'Other') {

            otherDiv.style.display = 'flex';
            otherInput.required = true;
            otherInput.focus();

        } else {

            otherDiv.style.display = 'none';
            otherInput.required = false;
            otherInput.value = '';

        }

    });


    // Automatic Total Users Trained
    const femaleInput =
        document.getElementById('female_users_trained');

    const maleInput =
        document.getElementById('male_users_trained');

    const totalInput =
        document.getElementById('total_users_trained');


    function calculateTotal() {

        const female =
            parseInt(femaleInput.value) || 0;

        const male =
            parseInt(maleInput.value) || 0;

        totalInput.value = female + male;

    }


    femaleInput.addEventListener(
        'input',
        calculateTotal
    );

    maleInput.addEventListener(
        'input',
        calculateTotal
    );

    calculateTotal();

});
</script>

{% endblock %}
